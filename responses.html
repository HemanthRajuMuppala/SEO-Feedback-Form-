<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey responses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap admin">
    <h1>Survey responses</h1>
    <p class="fineprint" style="text-align:left;margin:0 0 16px">Saved as JSON in this browser. You can download the file.</p>
    <p><button class="submit" id="download-json" type="button" style="width:auto;min-height:44px;padding:10px 16px">Download responses.json</button></p>
    <table>
      <thead>
        <tr>
          <th>When</th>
          <th>Days</th>
          <th>Fruits</th>
          <th>Dry fruits</th>
          <th>Diwali hamper</th>
          <th>Choose more often</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="6">Loading…</td></tr>
      </tbody>
    </table>
  </main>
  <script src="store.js"></script>
  <script>
    function join(list, extra) {
      const items = [...(list || [])];
      if (extra) items.push(extra);
      return items.join(", ") || "—";
    }

    const rows = loadResponses();
    const body = document.getElementById("rows");
    if (!rows.length) {
      body.innerHTML = "<tr><td colspan='6'>No responses yet.</td></tr>";
    } else {
      body.innerHTML = rows.slice().reverse().map((row) => `
        <tr>
          <td>${new Date(row.createdAt).toLocaleString()}</td>
          <td>${join(row.preferredDays)}</td>
          <td>${join(row.fruits, row.fruitsOther)}</td>
          <td>${join(row.dryFruits, row.dryFruitsOther)}</td>
          <td>${row.diwaliHamper || "—"}</td>
          <td>${join(row.chooseMoreOften, row.chooseMoreOftenOther)}</td>
        </tr>
      `).join("");
    }

    document.getElementById("download-json").addEventListener("click", downloadResponses);
  </script>
</body>
</html>
